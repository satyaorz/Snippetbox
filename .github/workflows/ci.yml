name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # The integration tests (internal/models, internal/migrate) need MySQL.
      # The MYSQL_USER gets full privileges on MYSQL_DATABASE, which covers
      # what db/test_setup.sql grants locally.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_snippetbox
          MYSQL_USER: test_web
          MYSQL_PASSWORD: pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      SNIPPETBOX_TEST_DSN: test_web:pass@tcp(127.0.0.1:3306)/test_snippetbox?parseTime=true&multiStatements=true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # Latest 1.26 patch release, so security fixes in the standard
          # library are picked up (govulncheck fails on older patches).
          go-version: "1.26.x"
          # Without this, setup-go uses whatever 1.26 release is cached on
          # the runner, which can lag behind the latest security patch.
          check-latest: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t snippetbox:ci .
